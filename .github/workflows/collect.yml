name: 从 Wikidata 采集人物关系

on:
  workflow_dispatch:            # 在 Actions 页面手动点 Run workflow
    inputs:
      names:
        description: '要新增的人名（可留空；多个用逗号分隔，如：李世民,杨贵妃）'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['collect/seeds.json']   # 修改种子人物后自动运行
  # 想让它定期自动刷新数据，去掉下面两行的 # 号（每周一 11:00 北京时间运行）：
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 采集
        env:
          REPORT: collect_report.md
          NAMES: ${{ github.event.inputs.names }}
        run: python3 scripts/collect_wikidata.py

      - name: 有变化时开一个 Pull Request（由你审核后再合并）
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain data collect)" ]; then
            echo "数据没有变化，不需要提交。"
            exit 0
          fi
          BR="auto/wikidata-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data collect/seeds.json
          git commit -m "自动采集：Wikidata 人物关系"
          git push origin "$BR"
          gh pr create --base "$BASE" --head "$BR" \
            --title "自动采集：Wikidata 人物关系" --body-file collect_report.md
          # collect/seeds.json 里写 "auto_merge": true 时，自动合并，不再等你审核
          AUTO=$(python3 -c "import json;print(str(json.load(open('collect/seeds.json',encoding='utf-8')).get('auto_merge',False)).lower())")
          # 目前：只看 auto_merge，按名字匹配的人物也会自动合并。
          # 日后想恢复保险（按名字匹配时必须人工审核），把下一行改成：
          #   if [ "$AUTO" = "true" ] && [ ! -f collect_review.flag ]; then
          if [ "$AUTO" = "true" ]; then
            # 刚建好的 PR 有时还在计算可合并状态，所以失败后等几秒重试
            OK=0
            for i in 1 2 3 4 5; do
              if gh pr merge "$BR" --squash; then OK=1; break; fi
              echo "第 $i 次合并失败，10 秒后重试…"
              sleep 10
            done
            # 不用 --delete-branch（在 Actions 里会因本地分支正被使用而报错），改为单独删远程分支
            git push origin --delete "$BR" || true
            if [ "$OK" != "1" ]; then
              echo "::warning::自动合并没有成功，PR 已建好，请到 Pull requests 手动合并。"
            fi
          fi
