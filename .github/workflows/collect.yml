name: 从 Wikidata 采集人物关系

on:
  workflow_dispatch:            # 在 Actions 页面手动点 Run workflow
  push:
    branches: [main]
    paths: ['collect/seeds.json']   # 修改种子人物后自动运行

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 采集
        env:
          REPORT: collect_report.md
        run: python3 scripts/collect_wikidata.py

      - name: 有变化时开一个 Pull Request（由你审核后再合并）
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "数据没有变化，不需要提交。"
            exit 0
          fi
          BR="auto/wikidata-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data
          git commit -m "自动采集：Wikidata 人物关系"
          git push origin "$BR"
          gh pr create --base "$BASE" --head "$BR" \
            --title "自动采集：Wikidata 人物关系" --body-file collect_report.md

