<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>人物关系球</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--fg:#e8ecf5;--dim:#8d96ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#16203c 0%,#0b1020 70%);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden;overscroll-behavior:none;
  position:fixed;inset:0;width:100%}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 4px;display:flex;flex-direction:column;gap:7px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.row{display:flex;gap:6px;align-items:center}
.srow{position:relative}
button,input{font:inherit;color:inherit}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.35}
.btn:active:not(:disabled){background:rgba(255,255,255,.2)}
#q{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;font-size:16px;outline:none}
#q::placeholder{color:var(--dim)}
.chips{flex-wrap:wrap;gap:6px}
.fpanel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:30vh;overflow:auto;padding:8px;background:rgba(14,20,40,.94);border:1px solid rgba(255,255,255,.16);border-radius:14px}
.fpanel[hidden]{display:none}
.fpanel .chip{cursor:pointer;color:inherit;font:inherit;font-size:13px}
.fpanel .chip small{opacity:.7}
.fpanel .ctl{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);opacity:.42}
.chip.on{opacity:1;background:rgba(255,255,255,.12)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.res{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:42vh;overflow:auto;background:rgba(14,20,40,.97);border:1px solid rgba(255,255,255,.16);border-radius:14px}
.res[hidden]{display:none}
.res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 14px;font-size:15px}
.res button small{color:var(--dim);margin-left:8px;font-size:12px}
.res button:active{background:rgba(255,255,255,.1)}
.card{position:fixed;left:0;right:0;bottom:0;padding:26px 14px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to top,rgba(11,16,32,.96) 55%,rgba(11,16,32,0));pointer-events:none;z-index:4}
.card>*{pointer-events:auto}
.card .nm{font-size:20px;font-weight:600;color:#ffd36b}
.card .nt{font-size:13px;color:#b9c0d4;margin-top:2px;line-height:1.4}
.card .ct{font-size:12px;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.card .ct b{font-weight:500}
.card a{color:#8ec5ff;text-decoration:none}
.ownk{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.ownk i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#aab;box-shadow:0 0 0 1.5px rgba(11,16,32,1),0 0 0 2.7px rgba(255,255,255,.8)}
.pop{position:fixed;left:0;right:0;bottom:0;z-index:7;pointer-events:none}
.pop[hidden]{display:none}
.pop .box{pointer-events:auto;max-height:44vh;overflow:auto;background:rgba(14,20,40,.98);border-top:1px solid rgba(255,255,255,.16);border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.pop .hd{display:flex;align-items:center;gap:8px}
.pop .ttl{font-size:17px;font-weight:600;flex:1}
.pop .x{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:28px;height:28px;font-size:16px;line-height:1}
.pop .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pop .ln{font-size:14px;color:#cfd5e6;margin-top:6px;line-height:1.5}
.pop .ln b{color:#fff;font-weight:500}
.pop .sec{margin-top:12px;font-size:12px;color:var(--dim)}
.pop .ev{margin-top:6px;padding:9px 11px;background:rgba(255,255,255,.05);border-radius:10px}
.pop .ev .l{font-size:15px;font-weight:600}
.pop .ev .m{font-size:13px;color:#cfd5e6;margin-top:2px}
.pop .src{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.pop .src a{color:#8ec5ff}
.pop .src.warn{color:#e0a458}
.pop .empty{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top" id="top">
  <div class="srow">
    <div class="row">
      <button class="btn" id="back" disabled>‹ 返回</button>
      <input id="q" type="search" placeholder="搜索人物（姓名或别名）" autocomplete="off" enterkeyhint="search">
      <button class="btn" id="recenter" title="把主角转回右上的原位">⌖ 回正</button>
      <button class="btn" id="fbtn" title="只显示某些关系人">筛选</button>
    </div>
    <div class="res" id="res" hidden></div>
  </div>
  <div class="fpanel" id="fpanel" hidden></div>
</div>
<div class="card" id="card"></div>
<div class="pop" id="pop" hidden></div>


<script>
(() => {
'use strict';

/* ───────── 数据 ───────── */
const TYPES = {
  kin:    {name:'亲属', rgb:'242,193,78'},
  spouse: {name:'夫妻', rgb:'255,122,156'},
  love:   {name:'感情', rgb:'255,110,64'},
  inlaw:  {name:'姻亲', rgb:'98,196,255'},
  servant:{name:'主仆', rgb:'143,227,138'},
  other:  {name:'师友', rgb:'196,160,255'},
  work:   {name:'创作', rgb:'210,214,230'},
  center: {name:'',     rgb:'255,211,107'}
};
const hex = t => 'rgb(' + TYPES[t].rgb + ')';
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

const people = new Map();
const adj = new Map();
// 合并多个数据文件：
//  · 同 id、或同 wikidata 编号的人合并成一个（别名取并集，先出现的简介优先）
//  · 同一对人、同类型的关系合并事件和来源
const wdIndex = new Map();
function ingest(docs) {
  const pk = (a, b, t) => (a < b ? a + '|' + b : b + '|' + a) + '|' + t;
  const remaps = docs.map(() => new Map());
  docs.forEach((doc, di) => {
    for (const p of (doc.people || [])) {
      let id = p.id;
      if (p.wikidata) { if (wdIndex.has(p.wikidata)) id = wdIndex.get(p.wikidata); else wdIndex.set(p.wikidata, p.id); }
      if (id !== p.id) remaps[di].set(p.id, id);
      const old = people.get(id);
      if (!old) { people.set(id, Object.assign({}, p, {id})); adj.set(id, []); continue; }
      const al = new Set([...(old.alias || []), ...(p.alias || [])]);
      if (p.name && p.name !== old.name) al.add(p.name);
      old.alias = [...al];
      for (const k of ['note', 'fictional', 'work', 'author', 'wikidata']) if (old[k] == null && p[k] != null) old[k] = p[k];
    }
  });
  const seen = new Map(), rels = [];
  docs.forEach((doc, di) => {
    const R = id => remaps[di].get(id) || id;
    for (const r0 of (doc.relations || [])) {
      const r = Object.assign({}, r0, {a: R(r0.a), b: R(r0.b)});
      if (!people.has(r.a) || !people.has(r.b) || !TYPES[r.type] || r.a === r.b) { console.warn('数据有误，已跳过', r0); continue; }
      const k = pk(r.a, r.b, r.type), ex = seen.get(k);
      if (ex) {
        const evs = ex.events || [];
        for (const ev of (r.events || [])) if (!evs.some(x => x.label === ev.label && x.date === ev.date)) evs.push(ev);
        if (evs.length) ex.events = evs;
        const ss = (v) => v == null ? [] : (Array.isArray(v) ? v : [v]);
        const have = ss(ex.src), add = ss(r0.src).filter(s => !have.some(t => (t.url || t.title || t) === (s.url || s.title || s)));
        if (add.length) ex.src = have.concat(add);
        continue;
      }
      if (!r.src && doc.meta && doc.meta.src) r.src = doc.meta.src;   // 文件级默认来源
      seen.set(k, r); rels.push(r);
    }
  });
  for (const r of rels) {
    adj.get(r.a).push({id: r.b, type: r.type, role: r.bIs, rel: r});
    adj.get(r.b).push({id: r.a, type: r.type, role: r.aIs, rel: r});
  }
}
const activeTypes = new Set(['kin','spouse','love','inlaw','servant','other','work']);
const roleOff = new Set();   // 被筛掉的称谓（只对当前主角生效，切换主角时清空）
let onlyOwn = false;         // 只显示带白圈（有自己关系网）的人，同样切换主角时清除
function neighborsAll(id) {
  const seen = new Set(), out = [];
  for (const x of (adj.get(id) || [])) {
    if (!activeTypes.has(x.type) || seen.has(x.id) || !people.has(x.id)) continue;
    seen.add(x.id); out.push(x);
  }
  return out;
}
// 有自己的关系网：除了与当前主角的这条线，还有别的关系记录（来自 data/ 里的手写数据或自动采集）
function hasOwn(id) {
  for (const x of (adj.get(id) || []))
    if (x.id !== centerId && activeTypes.has(x.type) && people.has(x.id)) return true;
  return false;
}
function neighborsOf(id) {
  const all = neighborsAll(id);
  if (id !== centerId || !(roleOff.size || onlyOwn)) return all;
  return all.filter(x => !roleOff.has(x.role || '其他') && (!onlyOwn || hasOwn(x.id)));
}

/* ───────── 数学工具 ───────── */
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len = a => Math.hypot(a[0],a[1],a[2]);
const norm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const clamp = (x,a,b) => x < a ? a : x > b ? b : x;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const qmul = (a,b) => [
  a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
  a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
  a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
  a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qnorm = q => { const l = Math.hypot(q[0],q[1],q[2],q[3]) || 1; return [q[0]/l,q[1]/l,q[2]/l,q[3]/l]; };
const qaxis = (ax, ang) => { const s = Math.sin(ang/2); return [Math.cos(ang/2), ax[0]*s, ax[1]*s, ax[2]*s]; };
const qrot = (q, v) => {
  const w=q[0], x=q[1], y=q[2], z=q[3];
  const tx = 2*(y*v[2]-z*v[1]), ty = 2*(z*v[0]-x*v[2]), tz = 2*(x*v[1]-y*v[0]);
  return [v[0]+w*tx+(y*tz-z*ty), v[1]+w*ty+(z*tx-x*tz), v[2]+w*tz+(x*ty-y*tx)];
};
function qslerp(a, b, t) {
  let d = a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
  if (d < 0) { b = b.map(v => -v); d = -d; }
  if (d > 0.9995) return qnorm(a.map((v,i) => v + (b[i]-v)*t));
  const th = Math.acos(d), s = Math.sin(th);
  const wa = Math.sin((1-t)*th)/s, wb = Math.sin(t*th)/s;
  return a.map((v,i) => v*wa + b[i]*wb);
}
function qfromTo(u, v) {           // 把单位向量 u 转到 v 的最短旋转
  const d = dot(u, v);
  if (d > 0.999999) return [1,0,0,0];
  if (d < -0.999999) {
    let ax = cross(u, [1,0,0]); if (len(ax) < 1e-3) ax = cross(u, [0,1,0]);
    ax = norm(ax); return [0, ax[0], ax[1], ax[2]];
  }
  const c = cross(u, v); return qnorm([1+d, c[0], c[1], c[2]]);
}
function vslerp(a, b, t) {          // 球面插值（单位向量）
  const th = Math.acos(clamp(dot(a,b), -1, 1));
  if (th < 1e-4) return b.slice();
  if (Math.PI - th < 1e-3) {
    let ax = cross(a, [0,1,0]); if (len(ax) < 1e-3) ax = cross(a, [1,0,0]);
    return qrot(qaxis(norm(ax), Math.PI*t), a);
  }
  const s = Math.sin(th), wa = Math.sin((1-t)*th)/s, wb = Math.sin(t*th)/s;
  return [a[0]*wa+b[0]*wb, a[1]*wa+b[1]*wb, a[2]*wa+b[2]*wb];
}
function hash(s) { let h = 2166136261 >>> 0; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619)>>>0; } return h; }
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ───────── 布局：以主角为中心，亲友随机均匀撒在球面 ───────── */
// 主角不在球的正中，而放在略偏右上的位置（HOME），这样连向亲友的线是沿球面弯的弧线；偏离不大，只为看出是球体
const HOME_ANG = 18*Math.PI/180, HOME_AZ = Math.PI/4;
const HOME = [Math.sin(HOME_ANG)*Math.cos(HOME_AZ), Math.sin(HOME_ANG)*Math.sin(HOME_AZ), Math.cos(HOME_ANG)];
function layout(centerId, ids) {
  // 每人约占 0.2 球面度：人少时只用一块球冠，人多了球冠逐渐扩大直到铺满整球。
  // 球冠的中心尽量靠近 HOME，但会向屏幕正面收一收，保证人少时全部落在可视的半球内。
  const M = ids.length + 1;
  const rnd = mulberry32(hash(centerId));
  const GA = Math.PI * (3 - Math.sqrt(5));
  const cosCap = Math.max(-1, 1 - M*0.2/(2*Math.PI));
  const rho = Math.acos(cosCap), span = 1 - cosCap;
  const ac = Math.max(0, Math.min(HOME_ANG, 1.25 - rho));
  const C = [Math.sin(ac)*Math.cos(HOME_AZ), Math.sin(ac)*Math.sin(HOME_AZ), Math.cos(ac)];
  const Rc = qfromTo([0,0,1], C);
  const roll = rnd()*Math.PI*2;
  const j = Math.sqrt(span*2*Math.PI/M)*0.16;
  const slots = [];
  for (let k = 0; k < M; k++) {
    const z = 1 - span*(k+0.5)/M, r = Math.sqrt(Math.max(0, 1-z*z)), th = k*GA + roll;
    slots.push(qrot(Rc, [r*Math.cos(th), r*Math.sin(th), z]));
  }
  let bi = 0, bd = -2;                       // 离 HOME 最近的一格留给主角，其余分给亲友
  slots.forEach((s, i) => { const d = dot(s, HOME); if (d > bd) { bd = d; bi = i; } });
  const rest = slots.filter((_, i) => i !== bi);
  const out = new Map([[centerId, HOME.slice()]]);
  const order = ids.slice().sort((a,b) => hash(centerId+'|'+a) - hash(centerId+'|'+b));
  order.forEach((pid, i) => {
    const q = rest[i];
    out.set(pid, norm([q[0]+(rnd()-.5)*2*j, q[1]+(rnd()-.5)*2*j, q[2]+(rnd()-.5)*2*j]));
  });
  spreadBearings(out, ids);
  return out;
}

// 避免两条线重合：从主角出发，每条线都是一段大圆弧，方向（方位角）几乎相同的两个人，
// 近的那条会整条压在远的那条上。这里把方位角太近的人绕主角轻轻转开，距离主角的远近不变。
function spreadBearings(out, ids) {
  const n = ids.length; if (n < 2) return;
  const e1 = norm(cross(HOME, [0, 0, 1])), e2 = cross(HOME, e1);
  const bearing = p => { const d = dot(p, HOME), t = [p[0]-HOME[0]*d, p[1]-HOME[1]*d, p[2]-HOME[2]*d]; return Math.atan2(dot(t, e2), dot(t, e1)); };
  const TAU = Math.PI*2, g = Math.min(9*Math.PI/180, 0.7*TAU/n);
  const mod = a => ((a % TAU) + TAU) % TAU;
  const items = ids.map(id => { const p = out.get(id), th = mod(bearing(p)); return {id, p, th0: th, th}; });
  for (let it = 0; it < 80; it++) {
    items.sort((a, b) => a.th - b.th);
    let moved = false;
    for (let i = 0; i < n; i++) {
      const a = items[i], c = items[(i+1) % n];
      const gap = i === n-1 ? c.th + TAU - a.th : c.th - a.th;
      if (gap < g - 1e-6) { const d = (g - gap)/2; a.th = mod(a.th - d); c.th = mod(c.th + d); moved = true; }
    }
    if (!moved) break;
  }
  for (const x of items) {            // 绕 HOME 轴转过的角度 = 新旧方位角之差（罗德里格斯旋转公式）
    let d = x.th - x.th0; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
    if (Math.abs(d) < 1e-9) continue;
    const c = Math.cos(d), s = Math.sin(d), k = HOME, v = x.p, kv = cross(k, v), kd = dot(k, v);
    out.set(x.id, norm([v[0]*c + kv[0]*s + k[0]*kd*(1-c), v[1]*c + kv[1]*s + k[1]*kd*(1-c), v[2]*c + kv[2]*s + k[2]*kd*(1-c)]));
  }
}

/* ───────── 状态 ───────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const elTop = document.getElementById('top'), elCard = document.getElementById('card');
let W=0, H=0, dpr=1, cx=0, cy=0, baseR=150;
let Q=[1,0,0,0], QG=[1,0,0,0];       // Q：节点视图旋转；QG：经纬网旋转（切换时不重置）
let zoom=1, auto=1, autoT=1;
let centerId=null;
const hist=[];
const nodes=new Map();   // id -> {id,pos,from,to,alpha,aFrom,aTo,type,role}
let edges=[];            // {a,b,type,role,grow,alpha,gFrom,gTo,aFrom,aTo}
let rot=null, trans=null, inertia=null;
let hoverId=null, needsDraw=true, lastInfo=[];
let lastLabels=[], lastArcs=[], cyT=0, baseRT=150;

function resize(immediate) {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  if (canvas.width !== Math.round(W*dpr) || canvas.height !== Math.round(H*dpr)) {
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
  }
  const topH = elTop.offsetHeight;
  const popH = (!elPop.hidden && elPop.firstChild) ? elPop.firstChild.offsetHeight : 0;
  const botH = Math.max(elCard.offsetHeight, popH);
  cx = W/2; cyT = topH + (H - topH - botH)/2;
  baseRT = Math.max(70, Math.min(W*0.46, (H - topH - botH)/2*0.93));
  if (immediate || !cy) { cy = cyT; baseR = baseRT; }
  needsDraw = true;
}

/* ───────── 切换主角 ───────── */
function bakeView() { for (const n of nodes.values()) n.pos = qrot(Q, n.pos); Q = [1,0,0,0]; }

function relayout(id) {
  closePop();
  try { history.replaceState(null, '', '#' + encodeURIComponent(id)); } catch (_) {}
  bakeView();
  centerId = id;
  const list = neighborsOf(id);
  const tg = layout(id, list.map(x => x.id));
  const keep = new Set([id, ...list.map(x => x.id)]);
  for (const n of nodes.values()) {
    n.from = n.pos.slice(); n.aFrom = n.alpha;

// 经纬网采样（世界坐标）

    for (let p = 0; p <= 360; p += 10) { const ph = p*Math.PI/180; c.push([Math.cos(ph)*Math.cos(lm), Math.sin(ph), Math.cos(ph)*Math.sin(lm)]); }

function draw() {
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if (!evs.length && (rel.from || rel.to)) {   // 有事件时时间已在事件里，不重复
    const t = rel.from && rel.to ? fmtDate(rel.from) + ' — ' + fmtDate(rel.to) : rel.from ? '自 ' + fmtDate(rel.from) : '至 ' + fmtDate(rel.to);
    box.appendChild(h('div', 'ln', '时间：' + t));
  }
  if (evs.length) {
    box.appendChild(h('div', 'sec', '相关事件'));
    evs.forEach(ev => {
      const d = h('div', 'ev');
      d.appendChild(h('div', 'l', ev.label || '事件'));
      const m = [fmtDate(ev.date), ev.place].filter(Boolean).join(' · ');
      if (m) d.appendChild(h('div', 'm', m));
      if (ev.note) d.appendChild(h('div', 'm', ev.note));
      d.appendChild(srcLine(normSrc(ev.src)));
      box.appendChild(d);
    });
  }
  const rs = normSrc(rel.src);
  if (rs.length) box.appendChild(srcLine(rs));
  if (!evs.length && !rs.length && !(rel.from || rel.to)) box.appendChild(h('div', 'empty', '暂无详细信息。日期、地点、事件可补充在数据里，每条信息都要附上来源。'));
  elPop.appendChild(box); elPop.hidden = false;
  needsDraw = true; requestAnimationFrame(() => resize(false));
}
function closePop() {
  if (elPop.hidden && !selEdge) return;
  selEdge = null; elPop.hidden = true; elPop.innerHTML = '';
  needsDraw = true; requestAnimationFrame(() => resize(false));
}
function segDist(px, py, a, b) {
  const dx = b[0]-a[0], dy = b[1]-a[1], l2 = dx*dx + dy*dy;
  const t = l2 ? clamp(((px-a[0])*dx + (py-a[1])*dy)/l2, 0, 1) : 0;
  return Math.hypot(px-(a[0]+t*dx), py-(a[1]+t*dy));
}
function hitEdge(x, y) {
  for (const L of lastLabels) { const b = L.b; if (x >= b[0]-5 && x <= b[2]+5 && y >= b[1]-5 && y <= b[3]+5) return L.e; }
  let best = null, bd = 12;
  for (const A of lastArcs) {
    if (A.e.alpha < 0.5 || A.e.grow < 0.98) continue;
    for (let i = 0; i < A.P.length-1; i++) {
      if (!A.F[i] || !A.F[i+1]) continue;
      const d = segDist(x, y, A.P[i], A.P[i+1]);
      if (d < bd) { bd = d; best = A.e; }
    }
  }
  return best;
}

/* ───────── 手势：拖动旋转 / 点击 / 双指缩放 ───────── */
const ptrs = new Map();
let drag = null, pinch = null;
function rotateView(yaw, pitch) {
  const R = qmul(qaxis([0,1,0], yaw), qaxis([1,0,0], pitch));
  Q = qnorm(qmul(R, Q)); QG = qnorm(qmul(R, QG)); needsDraw = true;
}
const curR = () => baseR*zoom*auto;
function hit(x, y, frontOnly) {
  let best = null, bs = 1e9;
  for (const it of lastInfo) {
    if (it.n.alpha < 0.3 || (frontOnly && !it.front)) continue;
    const d = Math.hypot(it.p[0]-x, it.p[1]-y), tol = it.front ? Math.max(20, it.r+10) : 12;
    const s = d - (it.front ? 12 : 0);
    if (d < tol && s < bs) { bs = s; best = it.n.id; }
  }
  return best;
}
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  finishAnims();
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) drag = {sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), tl: performance.now(), moved: 0, vy: 0, vp: 0};
  else if (ptrs.size === 2) {
    drag = null; const [a,b] = [...ptrs.values()];
    pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, z0: zoom};
  }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) {
    if (e.pointerType === 'mouse') { const h = hit(e.clientX, e.clientY, true); if (h !== hoverId) { hoverId = h; canvas.style.cursor = h ? 'pointer' : 'grab'; needsDraw = true; } }
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pinch && ptrs.size >= 2) {
    const [a,b] = [...ptrs.values()];
    zoom = clamp(pinch.z0 * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d0, 0.35, 3.2); needsDraw = true;
  } else if (drag) {
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly, now = performance.now(), dt = Math.max(1, now - drag.tl);
    drag.moved += Math.hypot(dx, dy);
    if (drag.moved > 6) {
      const R = curR(), yaw = dx/R*1.1, pitch = dy/R*1.1;
      rotateView(yaw, pitch);
      drag.vy = 0.6*drag.vy + 0.4*yaw/dt; drag.vp = 0.6*drag.vp + 0.4*pitch/dt;
    }
    drag.lx = e.clientX; drag.ly = e.clientY; drag.tl = now;
  }
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && e.type === 'pointerup') {
    const now = performance.now();
    if (drag.moved < 8 && now - drag.t0 < 600) {
      const id = hit(e.clientX, e.clientY, false);
      if (id) { if (id === centerId) bringToFront(id); else goTo(id); }
      else { const ed = hitEdge(e.clientX, e.clientY); if (ed) openPop(ed); else if (selEdge) closePop(); }
    } else if (now - drag.tl < 80 && Math.hypot(drag.vy, drag.vp) > 0.0004) inertia = {vy: drag.vy, vp: drag.vp};
  }
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) drag = null; else if (ptrs.size === 1) drag = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom*Math.exp(-e.deltaY*0.0012), 0.35, 3.2); needsDraw = true; }, {passive: false});
window.addEventListener('resize', () => resize(true));

/* ───────── 主循环 ───────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  let dirty = false;
  if (rot) {
    const t = Math.min(1, (now - rot.t0)/rot.dur), Rt = qslerp([1,0,0,0], rot.R, ease(t));
    Q = qmul(Rt, rot.Q0); QG = qmul(Rt, rot.G0); dirty = true;
    if (t >= 1) finishRot();
  }
  if (trans) {
    const t = Math.min(1, (now - trans.t0)/trans.dur);
    applyTrans(t); dirty = true;
    if (t >= 1) endTrans();
  }
  if (inertia) {
    rotateView(inertia.vy*dt, inertia.vp*dt);
    const k = Math.exp(-dt/320); inertia.vy *= k; inertia.vp *= k; dirty = true;
    if (Math.hypot(inertia.vy, inertia.vp) < 0.00004) inertia = null;
  }
  if (Math.abs(autoT - auto) > 0.002) { auto += (autoT - auto)*Math.min(1, dt/220); dirty = true; }
  if (Math.abs(cyT - cy) > 0.4 || Math.abs(baseRT - baseR) > 0.4) { const k = Math.min(1, dt/160); cy += (cyT - cy)*k; baseR += (baseRT - baseR)*k; dirty = true; }
  if (dirty || needsDraw) { needsDraw = false; draw(); }
  requestAnimationFrame(frame);
}

/* ───────── 启动 ───────── */
async function loadJSON(name) {
  const r = await fetch('data/' + name + '?v=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(name + '（HTTP ' + r.status + '）');
  return r.json();
}
async function loadAll() {
  if (window.__RELATION_DATA__) return window.__RELATION_DATA__;   // 仅供"预览版"使用
  const index = await loadJSON('index.json');
  const got = await Promise.allSettled(index.files.map(loadJSON));
  const docs = got.filter(g => g.status === 'fulfilled').map(g => g.value);
  got.filter(g => g.status === 'rejected').forEach(g => console.warn('数据文件读取失败：', g.reason && g.reason.message));
  if (!docs.length) throw got[0].reason;
  return {index, docs};
}
function pickStart(index) {
  let hs = ''; try { hs = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  if (hs && people.has(hs)) return hs;
  if (index && index.start && people.has(index.start)) return index.start;
  return people.keys().next().value;
}
canvas.style.cursor = 'grab';
resize(true);
elCard.innerHTML = '<div class="nt">加载中…</div>';
requestAnimationFrame(frame);
loadAll().then(({index, docs}) => {
  ingest(docs);
  if (!people.size) throw new Error('数据为空');
  relayout(pickStart(index));
}).catch(err => {
  elCard.innerHTML = '<div class="nm">数据加载失败</div><div class="nt">' + esc(err.message || err) +
    '<br>请通过网址（如 GitHub Pages）打开本页；直接用本地文件打开时，浏览器不允许读取 data 文件夹。</div>';
  resize(true);
});
window.relSphere = {people, toggleRole, roleOff, setOnlyOwn: v => { onlyOwn = v; refilter(); }, goTo, relayout, hasOwn, openPop, closePop, hitEdge, labels: () => lastLabels, edges: () => edges,
  pos: () => [...nodes.values()].filter(n => n.aTo !== 0).map(n => [n.id, n.to]),
  state: () => ({centerId, nodes: nodes.size, edges: edges.length, zoom})};
})();
</script>
